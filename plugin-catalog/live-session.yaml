name: live-session
repo: https://github.com/adamkrawczyk/hermes-live-session
sha: 81747dd28e64e9371e36135502f26f4e66a3ed44
description: "hermes live {ls,steer,queue,attach,continue}: see, steer, queue into, watch and keep running a session another terminal owns (for example your SSH login from another PC), through the gateway, without the classic CLI's 'open in another Hermes window/terminal' refusal and without interrupting the running turn; `continue` keeps a /goal running after its terminal quits. Disclosure — reads $HERMES_HOME/state.db read-only (titles, message counts, goal state), the terminal-lease registry and terminal-sessions breadcrumbs; runs `ps` and `who` locally to show which tty and SSH IP view a session; talks only to the local gateway; steer, queue and continue submit messages to the session you name."
maintainer: adamkrawczyk
tier: community
category: tools
requires_hermes: ">=0.22.2"
docs_url: https://github.com/adamkrawczyk/hermes-live-session#readme
version: "1.1.2"
title: Live Session
platforms: [linux, macos]
known_issues:
  - "Needs a Hermes build with the unified gateway runtime (v0.22.2 or newer). On older builds every command exits 1 with an 'update Hermes' message and does nothing."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
